[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-blueprint-agent-team"
version = "0.1.0"
description = "A provider-neutral staged agent team that turns a project request into a validated blueprint and safely bounded file prompts."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cinvana Lab" }]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
blueprint-team = "blueprint_team.__main__:main"

[tool.setuptools.packages.find]
include = ["blueprint_team*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
